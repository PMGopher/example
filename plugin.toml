name = "ExamplePlugin"
version = "1.1.0"
main = "example.Main"
api = ["5.0.0"]
load = "POSTWORLD"
authors = ["PMGopher"]
description = "Shows the basics of a PocketMine-go plugin."
website = "https://github.com/PMGopher/example"

[commands.example]
description = "Says hello and shows what the plugin knows about you."
usage = "/example [reload]"
aliases = ["ex"]
permission = "exampleplugin.command.example"

[permissions."exampleplugin.command.example"]
description = "Allows the use of /example"
default = true
